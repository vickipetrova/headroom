name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build app + DMG
        run: ./build.sh --dmg

      - name: Verify the DMG
        run: test -f build/Headroom.dmg

      # The DMG from CI is ad-hoc signed, not notarized — CI never sees a Developer ID. The release
      # is created as a DRAFT so the maintainer can sign, notarize, and staple locally
      # (docs/RELEASING.md), replace the asset, and then publish.
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --draft \
            --title "${GITHUB_REF_NAME}" \
            --notes "Draft. Replace the attached DMG with a signed + notarized build before publishing — see docs/RELEASING.md. Release notes: see CHANGELOG.md." \
            build/Headroom.dmg
